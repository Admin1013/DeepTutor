{% extends "base.html" %}
{% block title %}{{ kp.name }} · 第 {{ q_index + 1 }} 题{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="/learn/{{ kp.name }}" class="text-sm text-gray-500 hover:text-blue-600">← 返回讲解</a>
</div>

<div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
        <div class="text-xs text-gray-500">{{ kp.name }}</div>
        <div class="text-xs text-gray-500">第 {{ q_index + 1 }} / {{ q_total }} 题</div>
    </div>

    <!-- 进度条 -->
    <div class="h-1 bg-gray-100">
        <div class="h-full bg-blue-600" style="width: {{ (q_index + 1) / q_total * 100 }}%"></div>
    </div>

    <form action="/quiz/{{ kp.name }}/submit" method="post" class="px-5 py-5" id="quiz-form">
        <input type="hidden" name="question_id" value="{{ question.id }}">
        <input type="hidden" name="q_index" value="{{ q_index }}">

        <div class="mb-5 text-gray-900 leading-relaxed">
            {{ question.question }}
        </div>

        <div class="space-y-2 mb-6">
            {% for opt in question.options %}
            <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-colors">
                <input type="radio" name="answer" value="{{ loop.index0 }}" class="w-4 h-4 text-blue-600" required>
                <span class="text-sm text-gray-700">{{ opt }}</span>
            </label>
            {% endfor %}
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50" id="submit-btn">
            提交答案
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 选中后高亮
    document.querySelectorAll('input[name="answer"]').forEach(input => {
        input.addEventListener('change', () => {
            document.querySelectorAll('label').forEach(l => l.classList.remove('border-blue-500', 'bg-blue-50'));
            input.parentElement.classList.add('border-blue-500', 'bg-blue-50');
        });
    });
    // 渲染题目和选项中的 $...$ 公式
    window.renderMath(document.getElementById('quiz-form'));
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}初一数学{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-gray-900 font-semibold">
                <span class="text-2xl">📐</span>
                <span>初一数学助手</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="text-gray-600 hover:text-blue-600">知识地图</a>
                <a href="/profile" class="text-gray-600 hover:text-blue-600">我的画像</a>
                <a href="/parent" class="text-gray-600 hover:text-blue-600">家长页</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-xs text-gray-400">
        <p>初一数学学习辅助 · 人教版七年级上册</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
